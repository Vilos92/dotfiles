# C-g locally so a bare C-b falls through to any tmux I reach into, which keeps
# the default. Keyed on hostname, not $SSH_CONNECTION: the prefix is per-server
# and set at server start, so it can't depend on how a client connected.
unbind C-b
set -g prefix C-g
bind C-g send-prefix
if-shell '[ "$(hostname -s | tr "[:upper:]" "[:lower:]")" = gregs-mac-mini ]' {
    unbind C-g
    set -g prefix C-b
    bind C-b send-prefix
}

# Address vim mode switching delay
set -sg escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5

# Upgrade $TERM
set -g default-terminal "screen-256color"

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Let there be mouse support!
set -g mouse on

# Re-source this file
bind r source-file ~/.tmux.conf

# Personal commands

bind \\ split-window -h
bind _ split-window -v

bind - resize-pane -D 5
bind = resize-pane -U 5
bind [ resize-pane -L 5
bind ] resize-pane -R 5

# Vim-like pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Absolute path: run-shell is a bare `sh -c` inheriting the tmux server's PATH,
# which has ~/.local/bin but not the gmux submodule's bin/. Single-quoted so
# tmux leaves the expansion alone — it parses ${VAR} itself and rejects the
# :- default form — and sh, which does support it, resolves it instead.
bind g run-shell '${GREG_DOTFILES_PATH:-$HOME/greg_projects/dotfiles}/gmux/bin/gmux'
bind t run-shell "alacritty-theme-select > /dev/null 2>&1 || true"
bind T clock-mode
